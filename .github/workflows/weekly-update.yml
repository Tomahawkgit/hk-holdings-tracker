name: weekly-holdings-update
on:
  schedule:
    - cron: "30 1 * * 1"   # 每周一 09:30 香港时间（UTC+8）
  workflow_dispatch: {}     # 允许手动触发试跑

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python run_weekly.py
      - name: 提交并推回数据
        run: |
          git config user.name "hk-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "data: weekly update $(date -u +%F)"
          git push
