name: ashare-weekly-update

on:
  schedule:
    # 每周一 10:30 北京时间（UTC+8，即 UTC 02:30），与港股任务错开一小时
    - cron: "30 2 * * 1"
  workflow_dispatch: # 允许在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r ashare/requirements.txt

      - name: Build ashare_data.json
        run: python ashare/run_weekly.py

      - name: Commit & push
        run: |
          git config user.name "hk-tracker-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: ashare weekly update $(date -u +%F)"
            git push
          fi
