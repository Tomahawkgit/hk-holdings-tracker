<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>港股持仓结构周度跟踪</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  .wrap {
    font-family: var(--kimi-font-sans, sans-serif);
    color: var(--kimi-color-text-primary);
    padding-block-start: var(--kimi-space-4);
    padding-inline: var(--kimi-space-4);
    padding-block-end: var(--kimi-space-4);
    width: 100%;
    box-sizing: border-box;
  }
  button, input, select, textarea { font: inherit; }
  svg text { font-family: var(--kimi-font-sans, sans-serif); }

  .head-title { font-size: 17px; font-weight: 500; line-height: 24px; }
  .head-sub { font-size: 12px; color: var(--kimi-color-text-tertiary); margin-top: var(--kimi-space-1); }

  .chips { display: flex; flex-wrap: wrap; gap: var(--kimi-space-2); margin-top: var(--kimi-space-3); }

  .meta-row {
    display: flex; flex-wrap: wrap; gap: var(--kimi-space-4);
    margin-top: var(--kimi-space-4); align-items: baseline;
  }
  .meta-item .v { font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .meta-item .k { font-size: 12px; color: var(--kimi-color-text-tertiary); margin-top: 2px; }

  .section { margin-top: var(--kimi-space-5); }
  .section-title { font-size: 14px; font-weight: 500; color: var(--kimi-color-text-secondary); }

  /* 当前结构堆叠条 */
  .stack-bar {
    display: flex; height: 28px; border-radius: var(--kimi-radius-chip);
    overflow: hidden; margin-top: var(--kimi-space-2);
    border: 1px solid var(--kimi-color-border);
  }
  .stack-bar > div { height: 100%; }
  .legend {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: var(--kimi-space-1) var(--kimi-space-3); margin-top: var(--kimi-space-2);
  }
  .legend .li { display: flex; align-items: center; gap: var(--kimi-space-2); font-size: 12px; color: var(--kimi-color-text-secondary); }
  .legend .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .legend .num { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--kimi-color-text-primary); }

  .chart-legend { display: flex; flex-wrap: wrap; gap: var(--kimi-space-3); margin-top: var(--kimi-space-2); font-size: 12px; color: var(--kimi-color-text-secondary); }
  .trend-head { display: flex; align-items: center; justify-content: space-between; gap: var(--kimi-space-3); }

  /* 折线图悬浮浮层 */
  .chart-wrap { position: relative; margin-top: var(--kimi-space-2); }
  .chart-tip {
    position: absolute; display: none; pointer-events: none; z-index: 2; min-width: 148px;
    background: var(--kimi-color-surface-raised); border: 1px solid var(--kimi-color-border);
    border-radius: var(--kimi-radius-input); padding: var(--kimi-space-2) var(--kimi-space-3);
    font-size: 12px;
  }
  .chart-tip .tip-date { font-weight: 500; color: var(--kimi-color-text-primary); margin-bottom: var(--kimi-space-1); }
  .chart-tip .tip-row { display: flex; align-items: center; gap: var(--kimi-space-2); color: var(--kimi-color-text-secondary); line-height: 18px; }
  .chart-tip .tip-row .sw { width: 8px; height: 8px; border-radius: 2px; flex: none; }
  .chart-tip .tip-row .num { margin-left: auto; padding-left: var(--kimi-space-3); font-variant-numeric: tabular-nums; color: var(--kimi-color-text-primary); }
  .badge-tip { white-space: pre-line; z-index: 10; max-width: 280px; line-height: 18px; }
  .chart-legend .li { display: flex; align-items: center; gap: var(--kimi-space-1); }
  .chart-legend .sw { width: 10px; height: 10px; border-radius: 3px; }

  /* 中介明细表 */
  .table-scroll { max-height: 216px; overflow-y: auto; margin-top: var(--kimi-space-2); border: 1px solid var(--kimi-color-border); border-radius: var(--kimi-radius-input); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 6px var(--kimi-space-3); text-align: left; }
  th { font-size: 12px; color: var(--kimi-color-text-tertiary); font-weight: 400; position: sticky; top: 0; background: var(--kimi-color-surface); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tbody tr + tr td { border-top: 1px solid var(--kimi-color-border); }
  td .nm { display: block; max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cat { display: inline-flex; align-items: center; gap: var(--kimi-space-1); font-size: 12px; color: var(--kimi-color-text-secondary); }
  .cat .sw { width: 8px; height: 8px; border-radius: 2px; }

  .foot { margin-top: var(--kimi-space-4); font-size: 12px; color: var(--kimi-color-text-quaternary); }
  .empty { margin-top: var(--kimi-space-5); font-size: 14px; color: var(--kimi-color-text-tertiary); }

  /* SVG 折线与网格：宿主 kimi-svg-chart-* 类只设填充色，线条需自定义 stroke */
  .st-1 { stroke: var(--kimi-chart-1); }
  .st-2 { stroke: var(--kimi-chart-2); }
  .st-4 { stroke: var(--kimi-chart-4); }
  .st-5 { stroke: var(--kimi-chart-5); }
  .grid-line { stroke: var(--kimi-color-text-quaternary); }

</style>
<style>
  /* ===== 独立网页版垫片：替代 Kimi Work 宿主注入的设计系统 ===== */
  :root {
    --kimi-font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Segoe UI", sans-serif;
    --kimi-font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    --kimi-color-text-primary: #1a1d21;
    --kimi-color-text-secondary: #5c636e;
    --kimi-color-text-tertiary: #8a919d;
    --kimi-color-text-quaternary: #c3c9d2;
    --kimi-color-surface: #ffffff;
    --kimi-color-surface-muted: #f4f5f7;
    --kimi-color-surface-raised: #ffffff;
    --kimi-color-border: #e5e7eb;
    --kimi-color-accent: #2563eb;
    --kimi-color-warning: #b45309;
    --kimi-color-positive: #15803d;
    --kimi-color-danger: #dc2626;
    --kimi-chart-1: #2563eb;
    --kimi-chart-2: #dc2626;
    --kimi-chart-3: #16a34a;
    --kimi-chart-4: #7c3aed;
    --kimi-chart-5: #6b7280;
    --kimi-space-1: 4px; --kimi-space-2: 8px; --kimi-space-3: 12px; --kimi-space-4: 16px;
    --kimi-space-5: 20px; --kimi-space-6: 24px; --kimi-space-7: 32px;
    --kimi-radius-small: 4px; --kimi-radius-chip: 6px; --kimi-radius-button: 8px;
    --kimi-radius-input: 10px; --kimi-radius-panel: 12px; --kimi-radius-large: 16px;
    --kimi-radius-full: 999px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --kimi-color-text-primary: #eceef1;
      --kimi-color-text-secondary: #a7adb8;
      --kimi-color-text-tertiary: #7d8490;
      --kimi-color-text-quaternary: #565d68;
      --kimi-color-surface: #17191d;
      --kimi-color-surface-muted: #22252b;
      --kimi-color-surface-raised: #26292f;
      --kimi-color-border: #33373f;
      --kimi-chart-1: #5b8def; --kimi-chart-2: #ef5b5b; --kimi-chart-3: #3fbf72;
      --kimi-chart-4: #a78bfa; --kimi-chart-5: #9aa1ac;
      --kimi-color-accent: #5b8def; --kimi-color-warning: #d99a3d;
    }
  }
  body { background: var(--kimi-color-surface); }
  .wrap { max-width: 780px; margin: 0 auto; box-sizing: border-box; }

  /* 宿主组件类的本地实现 */
  .kimi-meta { font-size: 12px; color: var(--kimi-color-text-tertiary); }
  .kimi-segmented {
    display: inline-flex; gap: 2px; padding: 2px;
    background: var(--kimi-color-surface-muted); border-radius: var(--kimi-radius-button);
  }
  .kimi-chip {
    border: 1px solid var(--kimi-color-border); background: transparent;
    color: var(--kimi-color-text-secondary); font-size: 13px; line-height: 20px;
    padding: 3px 10px; border-radius: var(--kimi-radius-chip); cursor: pointer;
  }
  .kimi-chip:hover { color: var(--kimi-color-text-primary); }
  .kimi-chip[aria-pressed="true"] {
    background: var(--kimi-color-text-primary); border-color: var(--kimi-color-text-primary);
    color: var(--kimi-color-surface);
  }
  .kimi-segmented .kimi-chip { border-color: transparent; }
  .kimi-segmented .kimi-chip[aria-pressed="true"] { border-color: var(--kimi-color-text-primary); }
  .kimi-status {
    display: inline-flex; align-items: center; font-size: 12px; line-height: 18px;
    padding: 1px 8px; border-radius: var(--kimi-radius-full);
    background: var(--kimi-color-surface-muted); color: var(--kimi-color-text-tertiary);
  }
  .kimi-status--accent { background: color-mix(in srgb, var(--kimi-color-accent) 12%, transparent); color: var(--kimi-color-accent); }
  .kimi-status--warning { background: color-mix(in srgb, var(--kimi-color-warning) 14%, transparent); color: var(--kimi-color-warning); }
  .kimi-svg-text-secondary { fill: var(--kimi-color-text-tertiary); }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="head-title">港股持仓结构</div>
  <div class="head-sub" id="headSub">加载中…</div>
  <div class="chips" id="chips" role="group" aria-label="选择股票"></div>
  <div id="body"></div>
</div>

<script src="assets/loader.js"></script>
<script>
"use strict";
var FALLBACK_DATA = { updated: null, stocks: [] };

var CATS = [
  ["southbound", "南向资金", "var(--kimi-chart-2)", 1],
  ["foreign", "外资", "var(--kimi-chart-1)", 1],
  ["chinese", "中资", "var(--kimi-chart-4)", 1],
  ["local", "香港本地", "var(--kimi-chart-5)", 1],
  ["mainland", "境内股东H股", "var(--kimi-chart-2)", 0.45],
  ["other_ccass", "其他中介", "var(--kimi-chart-5)", 0.4],
  ["non_ccass", "未入CCASS", "var(--kimi-chart-5)", 0.15]
];
var TREND_CATS = CATS.slice(0, 5);
var SVG_NS = "http://www.w3.org/2000/svg";
var selectedCode = null;
var currentData = null;
var trendMode = "monthly";
var normMode = "issued";  // issued=占已发行股份, ccass=占CCASS托管

function saveViewState() {
  try {
    localStorage.setItem("hkHoldingsView", JSON.stringify({ code: selectedCode, trend: trendMode, norm: normMode }));
  } catch (e) {}
}

// 口径归一：ccass 模式下各类占比除以当期托管比例
function normVal(v, tot) {
  return (normMode === "ccass" && tot > 0) ? v / tot * 100 : v;
}
function normLabel() { return normMode === "ccass" ? "占 CCASS 托管" : "占已发行股份"; }

function fmtPct(v) { return (v == null ? "—" : Number(v).toFixed(2) + "%"); }
function fmtShares(v) {
  if (v == null) return "—";
  var e = v / 1e8;
  return (e >= 100 ? e.toFixed(0) : e.toFixed(2)) + " 亿股";
}
function el(tag, cls, text) {
  var d = document.createElement(tag);
  if (cls) d.className = cls;
  if (text != null) d.textContent = text;
  return d;
}
function svgEl(tag, attrs) {
  var n = document.createElementNS(SVG_NS, tag);
  for (var k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}
function catInfo(key) {
  for (var i = 0; i < CATS.length; i++) if (CATS[i][0] === key) return CATS[i];
  return [key, key, "var(--kimi-chart-5)", 0.5];
}
function swatch(color, opacity, cls) {
  var s = el("span", cls || "sw");
  s.style.background = color;
  if (opacity != null && opacity < 1) s.style.opacity = opacity;
  return s;
}

function fmtSharesShort(v) {
  if (v == null) return "";
  return v >= 1e8 ? "约" + (v / 1e8).toFixed(2) + "亿股" : "约" + Math.round(v / 1e4) + "万股";
}

// 限售解禁标签：未来 30 天内有解禁则亮起；到期天数按当天日期实时计算，不依赖任务运行
var badgeTipEl = null;
function hideBadgeTip() {
  if (badgeTipEl) { badgeTipEl.remove(); badgeTipEl = null; }
}
function showBadgeTip(target, text) {
  hideBadgeTip();
  var app = document.getElementById("app");
  if (!app) return;
  var d = el("div", "chart-tip badge-tip");
  d.style.position = "fixed";
  d.style.display = "block";
  d.textContent = text;
  app.appendChild(d);
  var r = target.getBoundingClientRect();
  var left = r.left;
  if (left + d.offsetWidth > window.innerWidth - 8) left = Math.max(8, window.innerWidth - d.offsetWidth - 8);
  d.style.left = left + "px";
  d.style.top = (r.bottom + 6) + "px";
  badgeTipEl = d;
}

function lockupBadge(lockups) {
  var now = new Date();
  var todayUtc = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
  var upcoming = (lockups || []).filter(function (l) {
    return l && l.date && Date.parse(l.date + "T00:00:00Z") >= todayUtc;
  }).sort(function (a, b) { return a.date < b.date ? -1 : 1; });
  var next = upcoming[0];
  var days = next ? Math.round((Date.parse(next.date + "T00:00:00Z") - todayUtc) / 86400000) : null;
  var soon = days != null && days <= 30;
  var badge = el("span", "kimi-status" + (soon ? " kimi-status--warning" : ""), soon ? "限售解禁 · " + days + " 天" : "限售解禁");
  badge.style.alignSelf = "center";
  var text;
  if (!next) {
    text = "近期无限售解禁";
  } else {
    text = "未来 " + days + " 天有限售解禁（" + next.date + "）" +
      (next.shares ? "，" + fmtSharesShort(next.shares) : "") +
      (next.note ? "：" + next.note : "");
    if (upcoming.length > 1) {
      text += "\n此后还有：" + upcoming.slice(1).map(function (l) { return l.date; }).join("、");
    }
  }
  badge.title = text;
  badge.style.cursor = "default";
  badge.addEventListener("mouseenter", function () { showBadgeTip(badge, text); });
  badge.addEventListener("mouseleave", hideBadgeTip);
  return badge;
}

/* ---------- 各区块渲染 ---------- */

function renderStack(cur) {
  var sec = el("div", "section");
  sec.appendChild(el("div", "section-title", "当前资金结构（" + normLabel() + "）"));
  var b = cur.buckets || {};
  var tot = cur.ccass_total_pct > 0 ? cur.ccass_total_pct : 100;
  var cats = normMode === "ccass" ? CATS.slice(0, 6) : CATS;  // 托管口径下无「未入CCASS」
  var bar = el("div", "stack-bar");
  cats.forEach(function (c) {
    var v = normVal(b[c[0]] || 0, tot);
    if (v <= 0) return;
    var seg = el("div");
    seg.style.width = v + "%";
    seg.style.background = c[2];
    if (c[3] < 1) seg.style.opacity = c[3];
    seg.title = c[1] + " " + fmtPct(v);
    bar.appendChild(seg);
  });
  sec.appendChild(bar);
  var lg = el("div", "legend");
  cats.forEach(function (c) {
    var v = normVal(b[c[0]] || 0, tot);
    var li = el("div", "li");
    li.appendChild(swatch(c[2], c[3]));
    li.appendChild(el("span", null, c[1]));
    li.appendChild(el("span", "num", fmtPct(v)));
    lg.appendChild(li);
  });
  sec.appendChild(lg);
  return sec;
}

function renderTrend(stock) {
  var sec = el("div", "section");
  var head = el("div", "trend-head");
  head.appendChild(el("div", "section-title", (trendMode === "weekly" ? "周度趋势（近 12 周" : "月度趋势（近 12 个月") + " · " + normLabel() + "）"));
  var seg = el("div", "kimi-segmented");
  seg.setAttribute("aria-label", "趋势颗粒度");
  [["monthly", "月度"], ["weekly", "周度"]].forEach(function (kv) {
    var b = el("button", "kimi-chip", kv[1]);
    b.setAttribute("aria-pressed", trendMode === kv[0] ? "true" : "false");
    b.addEventListener("click", function () {
      trendMode = kv[0];
      saveViewState();
      render(currentData);
    });
    seg.appendChild(b);
  });
  head.appendChild(seg);
  sec.appendChild(head);

  var series = (trendMode === "weekly" ? stock.weekly_series : stock.series) || [];
  // 周度只取最近 12 周（84 天窗口，以序列最后一个点为锚），与管道输出口径一致；
  // 旧版本 artifact 未截断，这里兜底过滤保证显示正确
  if (trendMode === "weekly" && series.length) {
    var tEnd = Date.parse(series[series.length - 1].date + "T00:00:00Z");
    series = series.filter(function (r) { return Date.parse(r.date + "T00:00:00Z") >= tEnd - 83 * 86400000; });
  }
  if (series.length < 2) { sec.appendChild(el("div", "empty", "历史数据不足")); return sec; }

  // 托管口径：各类占比除以每期 CCASS 托管比例；旧 artifact 缺 ccass_total 时用当前托管比例近似
  if (normMode === "ccass") {
    series = series.map(function (r) {
      var t = r.ccass_total > 0 ? r.ccass_total : ((stock.current && stock.current.ccass_total_pct) || 100);
      var o = { date: r.date };
      TREND_CATS.forEach(function (c) { o[c[0]] = (r[c[0]] || 0) / t * 100; });
      return o;
    });
  }

  var lg = el("div", "chart-legend");
  TREND_CATS.forEach(function (c) {
    var li = el("span", "li");
    li.appendChild(swatch(c[2], c[3]));
    li.appendChild(el("span", null, c[1]));
    lg.appendChild(li);
  });
  sec.appendChild(lg);

  var W = 680, H = 190, P = { l: 40, r: 8, t: 10, b: 22 };
  var maxV = 0;
  series.forEach(function (r) { TREND_CATS.forEach(function (c) { maxV = Math.max(maxV, r[c[0]] || 0); }); });
  var yMax = Math.max(10, Math.ceil(maxV / 20) * 20);
  var iw = W - P.l - P.r, ih = H - P.t - P.b;
  // 周度按真实时间轴绘制（点间距反映实际日期间隔），月度按等距索引
  var ts = series.map(function (r) { return Date.parse(r.date + "T00:00:00Z"); });
  var t0 = ts[0], t1 = ts[ts.length - 1];
  var x;
  if (trendMode === "weekly") {
    x = function (i) { return P.l + iw * (t1 === t0 ? 0.5 : (ts[i] - t0) / (t1 - t0)); };
  } else {
    x = function (i) { return P.l + iw * (series.length === 1 ? 0.5 : i / (series.length - 1)); };
  }
  var y = function (v) { return P.t + ih * (1 - v / yMax); };

  var svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, width: "100%", role: "img", "aria-label": trendMode === "weekly" ? "持仓结构周度趋势" : "持仓结构月度趋势" });
  for (var g = 0; g <= 4; g++) {
    var gv = yMax * g / 4, gy = y(gv);
    svg.appendChild(svgEl("line", { x1: P.l, x2: W - P.r, y1: gy, y2: gy, "class": "grid-line", "stroke-width": 1 }));
    var t = svgEl("text", { x: P.l - 6, y: gy + 4, "text-anchor": "end", "font-size": 11, "class": "kimi-svg-text-secondary" });
    t.textContent = gv + "%";
    svg.appendChild(t);
  }
  [0, Math.floor((series.length - 1) / 2), series.length - 1].forEach(function (i) {
    var t = svgEl("text", { x: x(i), y: H - 6, "text-anchor": "middle", "font-size": 11, "class": "kimi-svg-text-secondary" });
    t.textContent = (series[i].date || "").slice(0, 7);
    svg.appendChild(t);
  });
  var STROKE_CLS = [2, 1, 4, 5, 2];
  [0, 2, 3, 4, 1].forEach(function (ci) {  // 外资最后绘制，压在其他线之上
    var c = TREND_CATS[ci];
    var pts = series.map(function (r, i) { return x(i).toFixed(1) + "," + y(r[c[0]] || 0).toFixed(1); }).join(" ");
    var pl = svgEl("polyline", { points: pts, fill: "none", "stroke-width": c[0] === "foreign" ? 2.6 : 1.8, "stroke-linejoin": "round", "stroke-linecap": "round", "class": "st-" + STROKE_CLS[ci] });
    if (c[3] < 1) { pl.setAttribute("stroke-opacity", c[3]); pl.setAttribute("stroke-dasharray", "5 3"); }
    svg.appendChild(pl);
  });
  // 悬浮交互：透明热区 + 竖向参考线 + 各系列高亮点 + 跟随浮层
  var guide = svgEl("line", { y1: P.t, y2: P.t + ih, "class": "grid-line", "stroke-width": 1, "stroke-dasharray": "3 3", visibility: "hidden" });
  svg.appendChild(guide);
  var dots = TREND_CATS.map(function (c, ci) {
    var d = svgEl("circle", { r: 3.2, visibility: "hidden" });
    d.style.fill = c[2];
    if (c[3] < 1) d.setAttribute("fill-opacity", c[3]);
    svg.appendChild(d);
    return d;
  });
  var overlay = svgEl("rect", { x: P.l, y: P.t, width: iw, height: ih, fill: "transparent" });
  svg.appendChild(overlay);

  var wrap = el("div", "chart-wrap");
  wrap.appendChild(svg);
  var tip = el("div", "chart-tip");
  wrap.appendChild(tip);

  overlay.addEventListener("mousemove", function (ev) {
    var rect = svg.getBoundingClientRect();
    if (!rect.width) return;
    var mx = (ev.clientX - rect.left) / rect.width * W;
    var i = 0, bd = 1e18;
    for (var k = 0; k < series.length; k++) {
      var dd = Math.abs(x(k) - mx);
      if (dd < bd) { bd = dd; i = k; }
    }
    guide.setAttribute("x1", x(i)); guide.setAttribute("x2", x(i));
    guide.setAttribute("visibility", "visible");
    dots.forEach(function (d, ci) {
      d.setAttribute("cx", x(i));
      d.setAttribute("cy", y(series[i][TREND_CATS[ci][0]] || 0));
      d.setAttribute("visibility", "visible");
    });
    var html = '<div class="tip-date">' + series[i].date + '</div>';
    TREND_CATS.forEach(function (c) {
      html += '<div class="tip-row"><span class="sw" style="background:' + c[2] + ';opacity:' + c[3] + '"></span><span>' + c[1] + '</span><span class="num">' + fmtPct(series[i][c[0]]) + '</span></div>';
    });
    tip.innerHTML = html;
    tip.style.display = "block";
    var px = x(i) / W * rect.width;
    var left = px + 12;
    if (left + tip.offsetWidth > rect.width - 4) left = px - tip.offsetWidth - 12;
    tip.style.left = left + "px";
    tip.style.top = Math.max((ev.clientY - rect.top) - 10, 0) + "px";
  });
  overlay.addEventListener("mouseleave", function () {
    tip.style.display = "none";
    guide.setAttribute("visibility", "hidden");
    dots.forEach(function (d) { d.setAttribute("visibility", "hidden"); });
  });

  sec.appendChild(wrap);
  return sec;
}

function renderSouthbound(daily) {
  var sec = el("div", "section");
  sec.appendChild(el("div", "section-title", "南向持股比例（日频 · 占已发行）"));
  if (!daily || daily.length < 2) { sec.appendChild(el("div", "empty", "暂无南向数据")); return sec; }
  var W = 680, H = 90, P = { l: 40, r: 8, t: 6, b: 18 };
  var vals = daily.map(function (r) { return r.ratio; });
  var minV = Math.min.apply(null, vals), maxV = Math.max.apply(null, vals);
  var pad = Math.max((maxV - minV) * 0.15, 0.3);
  minV = Math.max(0, minV - pad); maxV += pad;
  var iw = W - P.l - P.r, ih = H - P.t - P.b;
  var x = function (i) { return P.l + iw * i / (daily.length - 1); };
  var y = function (v) { return P.t + ih * (1 - (v - minV) / (maxV - minV)); };
  var svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, width: "100%", role: "img", "aria-label": "南向持股比例日频走势" });
  [minV, (minV + maxV) / 2, maxV].forEach(function (v) {
    var t = svgEl("text", { x: P.l - 6, y: y(v) + 4, "text-anchor": "end", "font-size": 11, "class": "kimi-svg-text-secondary" });
    t.textContent = v.toFixed(1) + "%";
    svg.appendChild(t);
  });
  svg.appendChild(svgEl("line", { x1: P.l, x2: W - P.r, y1: y(minV), y2: y(minV), "class": "grid-line", "stroke-width": 1 }));
  var pts = daily.map(function (r, i) { return x(i).toFixed(1) + "," + y(r.ratio).toFixed(1); }).join(" ");
  svg.appendChild(svgEl("polyline", { points: pts, fill: "none", "stroke-width": 1.8, "stroke-linejoin": "round", "class": "st-2" }));
  [0, daily.length - 1].forEach(function (i) {
    var t = svgEl("text", { x: x(i), y: H - 4, "text-anchor": i === 0 ? "start" : "end", "font-size": 11, "class": "kimi-svg-text-secondary" });
    t.textContent = (daily[i].date || "").slice(0, 7);
    svg.appendChild(t);
  });
  sec.appendChild(svg);
  return sec;
}

function renderTop(top) {
  var sec = el("div", "section");
  sec.appendChild(el("div", "section-title", "前 12 大中介席位"));
  if (!top || !top.length) { sec.appendChild(el("div", "empty", "暂无数据")); return sec; }
  var sc = el("div", "table-scroll");
  var tb = el("table");
  var hd = el("thead");
  var htr = el("tr");
  ["中介", "类别", "占比", "持股数"].forEach(function (h, i) {
    htr.appendChild(el("th", i >= 2 ? "num" : null, h));
  });
  hd.appendChild(htr); tb.appendChild(hd);
  var body = el("tbody");
  top.forEach(function (r) {
    var c = catInfo(r.cat);
    var tr = el("tr");
    var tdN = el("td"); tdN.appendChild(el("span", "nm", r.name)); tr.appendChild(tdN);
    var tdC = el("td");
    var cat = el("span", "cat");
    cat.appendChild(swatch(c[2], c[3]));
    cat.appendChild(el("span", null, c[1]));
    tdC.appendChild(cat); tr.appendChild(tdC);
    tr.appendChild(el("td", "num", fmtPct(r.pct)));
    tr.appendChild(el("td", "num", fmtShares(r.shares)));
    body.appendChild(tr);
  });
  tb.appendChild(body); sc.appendChild(tb); sec.appendChild(sc);
  return sec;
}

/* ---------- 主渲染 ---------- */

function render(data) {
  var app = document.getElementById("app");
  if (!app) return;
  hideBadgeTip();
  currentData = data;
  var stocks = (data && data.stocks) || [];
  var headSub = document.getElementById("headSub");
  var chips = document.getElementById("chips");
  var body = document.getElementById("body");
  if (!stocks.length) { headSub.textContent = "数据加载中…"; return; }

  if (!selectedCode || !stocks.some(function (s) { return s.code === selectedCode; })) {
    selectedCode = stocks[0].code;
  }
  var st = null;
  stocks.forEach(function (s) { if (s.code === selectedCode) st = s; });

  var s = st;
  var sub = "数据更新 " + (data.updated || "—");
  if (s.current && s.current.date) sub += " · 持股日期 " + s.current.date;
  if (s.verification_ok === true) sub += " · 南向交叉校验通过";
  else if (s.verification_ok === false) sub += " · 南向校验存在偏差";
  headSub.textContent = sub;

  chips.textContent = "";
  stocks.forEach(function (it) {
    var b = el("button", "kimi-chip", it.name + " " + it.code);
    b.setAttribute("aria-pressed", it.code === selectedCode ? "true" : "false");
    b.addEventListener("click", function () {
      selectedCode = it.code;
      saveViewState();
      render(currentData);
    });
    chips.appendChild(b);
  });

  body.textContent = "";
  if (!s.current) { body.appendChild(el("div", "empty", "该股票暂无 CCASS 数据")); return; }

  // 结构口径切换：占已发行 / 占托管（联动堆叠条、趋势图、浮层与顶部数字）
  var normRow = el("div", "trend-head");
  normRow.style.marginTop = "var(--kimi-space-3)";
  normRow.appendChild(el("span", "kimi-meta", "结构口径"));
  var nseg = el("div", "kimi-segmented");
  nseg.setAttribute("aria-label", "结构口径");
  [["issued", "占已发行"], ["ccass", "占托管"]].forEach(function (kv) {
    var nb = el("button", "kimi-chip", kv[1]);
    nb.setAttribute("aria-pressed", normMode === kv[0] ? "true" : "false");
    nb.addEventListener("click", function () {
      normMode = kv[0];
      saveViewState();
      render(currentData);
    });
    nseg.appendChild(nb);
  });
  normRow.appendChild(nseg);
  body.appendChild(normRow);

  var tot = s.current.ccass_total_pct > 0 ? s.current.ccass_total_pct : 100;
  var bk = s.current.buckets || {};
  var shortNorm = normMode === "ccass" ? "占托管" : "占已发行";
  var meta = el("div", "meta-row");
  [["CCASS 托管比例", fmtPct(s.current.ccass_total_pct)],
   ["南向持股 · " + shortNorm, fmtPct(normVal(bk.southbound, tot))],
   ["外资持股 · " + shortNorm, fmtPct(normVal(bk.foreign, tot))],
   ["已发行股份", fmtShares(s.current.issued)]
  ].forEach(function (kv) {
    var it = el("div", "meta-item");
    it.appendChild(el("div", "v", kv[1]));
    it.appendChild(el("div", "k", kv[0]));
    meta.appendChild(it);
  });
  if (s.in_stock_connect) {
    var badge = el("span", "kimi-status kimi-status--accent", "港股通标的");
    badge.style.alignSelf = "center";
    meta.appendChild(badge);
  }
  meta.appendChild(lockupBadge(s.lockups));
  body.appendChild(meta);

  body.appendChild(renderStack(s.current));
  body.appendChild(renderTrend(s));
  if (s.in_stock_connect) body.appendChild(renderSouthbound(s.southbound_daily));
  body.appendChild(renderTop(s.current.top));

  var foot = el("div", "foot", "中介席位变动不等于真实买卖，趋势解读以类别汇总为准。数据来源：港交所 CCASS、东方财富港股通。仅供参考，不构成投资建议。");
  body.appendChild(foot);
}

function boot() {
  // 恢复上次的界面选择（股票 / 颗粒度 / 口径）
  try {
    var vs = JSON.parse(localStorage.getItem("hkHoldingsView") || "{}");
    if (vs.code) selectedCode = vs.code;
    if (vs.trend === "weekly" || vs.trend === "monthly") trendMode = vs.trend;
    if (vs.norm === "ccass" || vs.norm === "issued") normMode = vs.norm;
  } catch (e) {}
  loadData({
    remoteUrls: [
      "https://raw.githubusercontent.com/Tomahawkgit/hk-holdings-tracker/main/hshare/widget_data.json",
      "https://cdn.jsdelivr.net/gh/Tomahawkgit/hk-holdings-tracker@main/hshare/widget_data.json"
    ],
    localUrl: "widget_data.json",
    fallback: FALLBACK_DATA,
    render: render,
    merge: true,
    onFail: function () { var h = document.getElementById("headSub"); if (h) h.textContent = "数据加载失败，请稍后刷新"; }
  });
}
boot();
</script>
