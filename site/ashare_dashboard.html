<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A股资金结构五层面板</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  .wrap {
    font-family: var(--kimi-font-sans, sans-serif);
    color: var(--kimi-color-text-primary);
    padding-block-start: var(--kimi-space-4);
    padding-inline: var(--kimi-space-4);
    padding-block-end: var(--kimi-space-4);
    width: 100%;
    box-sizing: border-box;
  }
  button, input, select, textarea { font: inherit; }

  .head-title { font-size: 17px; font-weight: 500; line-height: 24px; }
  .head-sub { font-size: 12px; color: var(--kimi-color-text-tertiary); margin-top: var(--kimi-space-1); }
  .chips { display: flex; flex-wrap: wrap; gap: var(--kimi-space-2); margin-top: var(--kimi-space-3); }

  .meta-row { display: flex; flex-wrap: wrap; gap: var(--kimi-space-4); margin-top: var(--kimi-space-4); align-items: baseline; }
  .meta-item .v { font-size: 20px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .meta-item .k { font-size: 12px; color: var(--kimi-color-text-tertiary); margin-top: 2px; }

  .section { margin-top: var(--kimi-space-5); }
  .section-title { font-size: 14px; font-weight: 500; color: var(--kimi-color-text-secondary); display: flex; align-items: baseline; gap: var(--kimi-space-2); }
  .section-title .asof { margin-left: auto; font-size: 11px; color: var(--kimi-color-text-quaternary); font-weight: 400; }

  /* ===== 五层面板 ===== */
  .layer-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(158px, 1fr)); gap: var(--kimi-space-2); margin-top: var(--kimi-space-2); }
  .layer-card {
    background: var(--kimi-color-surface); border: 1px solid var(--kimi-color-border);
    border-radius: var(--kimi-radius-panel); padding: var(--kimi-space-3) var(--kimi-space-3) var(--kimi-space-2);
    border-top: 3px solid var(--lc, #8a90a6);
  }
  .lc-head { display: flex; align-items: center; gap: var(--kimi-space-2); }
  .lc-swatch { width: 9px; height: 9px; border-radius: 3px; background: var(--lc); flex: none; }
  .lc-name { font-size: 13px; font-weight: 600; }
  .lc-sig { margin-left: auto; }
  .lc-val { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: var(--kimi-space-2); line-height: 1.2; }
  .lc-val small { font-size: 12px; color: var(--kimi-color-text-tertiary); font-weight: 400; margin-left: 2px; }
  .lc-delta {
    display: inline-block; margin-left: var(--kimi-space-2); font-size: 11px; font-weight: 600;
    padding: 1px 7px; border-radius: 999px; background: var(--kimi-color-surface-muted); color: var(--kimi-color-text-secondary);
    vertical-align: 3px; font-variant-numeric: tabular-nums;
  }
  .lc-delta.up { color: var(--kimi-color-danger); }
  .lc-delta.dn { color: var(--kimi-color-positive); }
  .lc-note { font-size: 12px; color: var(--kimi-color-text-secondary); margin-top: 6px; line-height: 1.55; min-height: 2.9em; }
  .lc-extra { font-size: 11px; color: var(--kimi-color-text-tertiary); line-height: 1.6; }
  .lc-foot { font-size: 10px; color: var(--kimi-color-text-quaternary); margin-top: var(--kimi-space-2); padding-top: 6px; border-top: 1px dashed var(--kimi-color-border); letter-spacing: .04em; }

  /* 信号徽标 */
  .sig { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 999px; }
  .sig i { width: 5px; height: 5px; border-radius: 50%; font-style: normal; }
  .sig.pos { color: var(--kimi-color-positive); background: color-mix(in srgb, var(--kimi-color-positive) 12%, transparent); }
  .sig.pos i { background: var(--kimi-color-positive); }
  .sig.neg { color: var(--kimi-color-danger); background: color-mix(in srgb, var(--kimi-color-danger) 12%, transparent); }
  .sig.neg i { background: var(--kimi-color-danger); }
  .sig.watch { color: var(--kimi-color-warning); background: color-mix(in srgb, var(--kimi-color-warning) 14%, transparent); }
  .sig.watch i { background: var(--kimi-color-warning); }
  .sig.neu { color: var(--kimi-color-text-tertiary); background: var(--kimi-color-surface-muted); }
  .sig.neu i { background: var(--kimi-color-text-quaternary); }

  /* ===== 通用表格 ===== */
  .table-scroll { max-height: 300px; overflow-y: auto; margin-top: var(--kimi-space-2); border: 1px solid var(--kimi-color-border); border-radius: var(--kimi-radius-input); background: var(--kimi-color-surface); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 7px var(--kimi-space-3); text-align: left; }
  th { font-size: 11px; color: var(--kimi-color-text-tertiary); font-weight: 400; position: sticky; top: 0; background: var(--kimi-color-surface); z-index: 1; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tbody tr + tr td { border-top: 1px solid var(--kimi-color-border); }
  td .nm { display: block; max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ltag { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--kimi-color-text-secondary); white-space: nowrap; }
  .ltag .sw { width: 8px; height: 8px; border-radius: 2px; flex: none; }
  .chg { font-variant-numeric: tabular-nums; font-size: 12px; white-space: nowrap; }
  .chg.up { color: var(--kimi-color-danger); }
  .chg.dn { color: var(--kimi-color-positive); }

  /* ===== 机构持仓条 ===== */
  .org-list { margin-top: var(--kimi-space-2); display: flex; flex-direction: column; gap: 7px; }
  .org-row { display: flex; align-items: center; gap: var(--kimi-space-3); font-size: 12.5px; }
  .org-row .nm { width: 56px; flex: none; color: var(--kimi-color-text-secondary); }
  .org-row .cnt { width: 74px; flex: none; color: var(--kimi-color-text-tertiary); font-size: 11px; font-variant-numeric: tabular-nums; }
  .org-bar { flex: 1; height: 14px; background: var(--kimi-color-surface-muted); border-radius: 4px; overflow: hidden; }
  .org-bar > div { height: 100%; background: var(--lc, #0e9f9f); border-radius: 4px; }
  .org-row .pct { width: 62px; flex: none; text-align: right; font-variant-numeric: tabular-nums; }
  .org-row .dlt { width: 76px; flex: none; text-align: right; font-size: 11px; font-variant-numeric: tabular-nums; }

  /* ===== 图表 ===== */
  .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--kimi-space-3); margin-top: var(--kimi-space-2); }
  .chart-card { background: var(--kimi-color-surface); border: 1px solid var(--kimi-color-border); border-radius: var(--kimi-radius-panel); padding: var(--kimi-space-3); }
  .chart-card .cc-title { font-size: 12.5px; font-weight: 600; display: flex; align-items: baseline; gap: var(--kimi-space-2); }
  .chart-card .cc-title .v { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--kimi-color-text-secondary); font-weight: 500; }
  .chart-card .cc-sub { font-size: 11px; color: var(--kimi-color-text-tertiary); margin-top: 2px; }
  .chart-card svg { width: 100%; height: auto; display: block; margin-top: var(--kimi-space-2); }
  @media (max-width: 720px) { .chart-grid { grid-template-columns: 1fr; } }

  /* ===== 龙虎榜 / 事件 ===== */
  .lhb-item { padding: var(--kimi-space-2) var(--kimi-space-3); border: 1px solid var(--kimi-color-border); border-radius: var(--kimi-radius-input); background: var(--kimi-color-surface); margin-top: var(--kimi-space-2); }
  .lhb-item .lh-top { display: flex; align-items: center; gap: var(--kimi-space-2); font-size: 12.5px; flex-wrap: wrap; }
  .lhb-item .lh-date { font-weight: 600; font-variant-numeric: tabular-nums; }
  .lhb-item .lh-reason { color: var(--kimi-color-text-secondary); font-size: 12px; }
  .lhb-item .lh-net { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 600; font-size: 12.5px; }
  .lhb-item .lh-seats { margin-top: 6px; font-size: 11.5px; color: var(--kimi-color-text-tertiary); line-height: 1.7; }
  .lhb-item .lh-seats b { color: var(--kimi-color-text-secondary); font-weight: 500; }

  .evt-list { margin-top: var(--kimi-space-2); display: flex; flex-direction: column; gap: 6px; }
  .evt { display: flex; align-items: baseline; gap: var(--kimi-space-2); font-size: 12.5px; padding: 7px var(--kimi-space-3); border: 1px solid var(--kimi-color-border); border-radius: var(--kimi-radius-input); background: var(--kimi-color-surface); }
  .evt .d { font-variant-numeric: tabular-nums; color: var(--kimi-color-text-tertiary); flex: none; font-size: 12px; }
  .evt .t { flex: none; }
  .evt .n { color: var(--kimi-color-text-secondary); font-size: 12px; }

  .gap-note { margin-top: var(--kimi-space-2); font-size: 11.5px; color: var(--kimi-color-text-tertiary); line-height: 1.8; padding: var(--kimi-space-2) var(--kimi-space-3); border: 1px dashed var(--kimi-color-border); border-radius: var(--kimi-radius-input); }
  .foot { margin-top: var(--kimi-space-4); font-size: 12px; color: var(--kimi-color-text-quaternary); line-height: 1.8; }
  .empty { margin-top: var(--kimi-space-5); font-size: 14px; color: var(--kimi-color-text-tertiary); }
</style>
<style>
  /* ===== 独立网页版垫片：替代 Kimi Work 宿主注入的设计系统 ===== */
  :root {
    --kimi-font-sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Segoe UI", sans-serif;
    --kimi-font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    --kimi-color-text-primary: #1a1d21;
    --kimi-color-text-secondary: #5c636e;
    --kimi-color-text-tertiary: #8a919d;
    --kimi-color-text-quaternary: #c3c9d2;
    --kimi-color-surface: #ffffff;
    --kimi-color-surface-muted: #f4f5f7;
    --kimi-color-surface-raised: #ffffff;
    --kimi-color-border: #e5e7eb;
    --kimi-color-accent: #2563eb;
    --kimi-color-warning: #b45309;
    --kimi-color-positive: #15803d;
    --kimi-color-danger: #dc2626;
    --kimi-space-1: 4px; --kimi-space-2: 8px; --kimi-space-3: 12px; --kimi-space-4: 16px;
    --kimi-space-5: 20px; --kimi-space-6: 24px; --kimi-space-7: 32px;
    --kimi-radius-small: 4px; --kimi-radius-chip: 6px; --kimi-radius-button: 8px;
    --kimi-radius-input: 10px; --kimi-radius-panel: 12px; --kimi-radius-large: 16px;
    --kimi-radius-full: 999px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --kimi-color-text-primary: #e8eaed;
      --kimi-color-text-secondary: #b0b6bf;
      --kimi-color-text-tertiary: #7d8490;
      --kimi-color-text-quaternary: #565d68;
      --kimi-color-surface: #1a1d21;
      --kimi-color-surface-muted: #23262b;
      --kimi-color-surface-raised: #23262b;
      --kimi-color-border: #33373d;
    }
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="assets/loader.js"></script>
<script>
// ===== 内联兜底数据（双击直接打开也能显示；页面加载后会被云端/站内最新数据替换）=====
var FALLBACK_DATA = { updated: null, stocks: [] };

// ===== 五层定义（配色与全站一致：深紫=产业资本，蓝=外资，青=境内机构，橙=游资，灰=散户）=====
var LAYERS = [
  { key: "industrial",  label: "产业资本",       color: "#5548c8", freq: "季报 · 十大股东 / 增减持公告" },
  { key: "foreign",     label: "外资（北向等）", color: "#2f6fed", freq: "季报 · 香港中央结算（2024-08 起北向仅季度可见）" },
  { key: "institution", label: "境内机构",       color: "#0e9f9f", freq: "季报 · 十大股东 + 机构持仓汇总" },
  { key: "hot",         label: "游资 / 大户",    color: "#e8853d", freq: "事件 · 龙虎榜" },
  { key: "retail",      label: "散户",           color: "#8a90a6", freq: "季报户数 · 日频两融" }
];
var LAYER_MAP = {};
LAYERS.forEach(function (l) { LAYER_MAP[l.key] = l; });
var SIG_LABEL = { pos: "积极", neg: "压力", watch: "关注", neu: "中性" };

var app = document.getElementById("app");
var selectedCode = null;

function el(tag, cls, text) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined && text !== null) e.textContent = text;
  return e;
}
function fmtPct(x, digits) {
  if (x === null || x === undefined || isNaN(x)) return "—";
  return Number(x).toFixed(digits === undefined ? 2 : digits) + "%";
}
function fmtDelta(x) {
  if (x === null || x === undefined || isNaN(x)) return null;
  var v = Number(x);
  return (v > 0 ? "+" : "") + v.toFixed(2) + "pct";
}
function fmtYi(x) {
  if (x === null || x === undefined || isNaN(x)) return "—";
  return (Number(x) / 1e8).toFixed(2) + "亿";
}
function fmtWan(x) {
  if (x === null || x === undefined || isNaN(x)) return "—";
  var v = Number(x);
  if (Math.abs(v) >= 1e8) return (v / 1e8).toFixed(2) + "亿";
  return (v / 1e4).toFixed(0) + "万";
}
function signedClass(x) { return Number(x) > 0 ? "up" : (Number(x) < 0 ? "dn" : ""); }
function sigPill(level) {
  var s = el("span", "sig " + (level || "neu"));
  s.appendChild(el("i"));
  s.appendChild(document.createTextNode(SIG_LABEL[level] || "中性"));
  return s;
}

// ================= 头部 =================
function renderHead(d) {
  var head = el("div");
  head.appendChild(el("div", "head-title", "A股资金结构五层面板"));
  head.appendChild(el("div", "head-sub",
    "产业资本定底仓 · 外资定边际 · 机构定趋势 · 游资定波动 · 散户定反指｜A股无全量席位登记，以「五层资金面板」分层跟踪，各层数据频率不同，以卡片标注期日为准"));
  var chips = el("div", "chips");
  d.stocks.forEach(function (s) {
    var b = el("button", "kimi-chip" + (s.code === selectedCode ? " kimi-chip--selected" : ""), s.name + " " + s.code);
    b.style.cssText = "border:1px solid var(--kimi-color-border);background:" +
      (s.code === selectedCode ? "var(--kimi-color-text-primary);color:var(--kimi-color-surface)" : "var(--kimi-color-surface);color:var(--kimi-color-text-secondary)") +
      ";border-radius:999px;padding:4px 14px;font-size:13px;cursor:pointer";
    b.onclick = function () { selectedCode = s.code; try { localStorage.setItem("ashareView", s.code); } catch (e) {} render(CACHE); };
    chips.appendChild(b);
  });
  head.appendChild(chips);
  var meta = el("div", "meta-row");
  var items = [
    ["数据更新", d.updated || "—"],
    ["跟踪标的", d.stocks.length + " 只"],
    ["更新节奏", "周更（两融/龙虎榜/事件）· 季更（股东/机构/户数）"]
  ];
  items.forEach(function (kv) {
    var it = el("div", "meta-item");
    it.appendChild(el("div", "v", kv[1]));
    it.appendChild(el("div", "k", kv[0]));
    meta.appendChild(it);
  });
  head.appendChild(meta);
  return head;
}

// ================= 五层面板 =================
function layerCard(l, valHtml, deltaHtml, sig, note, extra, foot) {
  var c = el("div", "layer-card");
  c.style.setProperty("--lc", l.color);
  var h = el("div", "lc-head");
  h.appendChild(el("span", "lc-swatch"));
  h.appendChild(el("span", "lc-name", l.label));
  var sg = el("span", "lc-sig"); sg.appendChild(sigPill(sig && sig[0]));
  h.appendChild(sg);
  c.appendChild(h);
  var v = el("div", "lc-val");
  v.innerHTML = valHtml;
  if (deltaHtml) { var dEl = el("span", "lc-delta"); dEl.innerHTML = deltaHtml.html; if (deltaHtml.cls) dEl.classList.add(deltaHtml.cls); v.appendChild(dEl); }
  c.appendChild(v);
  c.appendChild(el("div", "lc-note", note || (sig && sig[1]) || ""));
  if (extra) c.appendChild(el("div", "lc-extra", extra));
  c.appendChild(el("div", "lc-foot", foot || l.freq));
  return c;
}

function renderLayers(s) {
  var sec = el("div", "section");
  var t = el("div", "section-title", "五层资金面板");
  t.appendChild(el("span", "asof", "股东名册期 " + (s.structure.as_of || "—") + "（对比 " + (s.structure.prev_as_of || "—") + "）"));
  sec.appendChild(t);
  var grid = el("div", "layer-grid");
  var st = s.structure, sig = s.signals || {};
  var sum = st.layer_sum || {}, dlt = st.layer_delta || {};

  // 产业资本
  var indEvents = (s.events || []).filter(function (e) { return e.type === "增持" || e.type === "减持"; });
  var indNet = indEvents.filter(function (e) { return e.type === "增持"; }).length - indEvents.filter(function (e) { return e.type === "减持"; }).length;
  grid.appendChild(layerCard(LAYER_MAP.industrial,
    fmtPct(sum.industrial).replace("%", "<small>% 流通盘</small>"),
    dlt.industrial ? { html: fmtDelta(dlt.industrial), cls: signedClass(dlt.industrial) } : null,
    sig.industrial, null,
    "近一年增减持公告 " + indEvents.length + " 次（净方向 " + (indNet > 0 ? "增持" : indNet < 0 ? "减持" : "持平") + "）· 未来解禁 " + (s.lifts_future || []).length + " 笔",
    null));

  // 外资
  var nb = st.northbound || {};
  grid.appendChild(layerCard(LAYER_MAP.foreign,
    fmtPct(nb.pct_float).replace("%", "<small>% 流通盘</small>"),
    nb.delta !== null && nb.delta !== undefined ? { html: fmtDelta(nb.delta), cls: signedClass(nb.delta) } : null,
    sig.foreign, null,
    "香港中央结算（北向）持股 · 2024-08 起北向资金仅季度披露，日频流向已停止公布",
    null));

  // 境内机构
  var orgTotal = null, fundNum = null;
  (st.org_holdings || []).forEach(function (o) {
    if (o.name === "合计") orgTotal = o;
    if (o.name === "基金") fundNum = o.num;
  });
  // 口径修正：全口径仅中报/年报可得，delta 用管线算好的相邻全口径差值（org_delta），不用接口 free_change（跨口径）
  var orgDelta = (st.org_delta !== undefined && st.org_delta !== null) ? st.org_delta : (orgTotal && orgTotal.free_change);
  var orgExtra = "全部机构合计（十大股东外含公募/社保/QFII 等，基金 " + (fundNum || 0) + " 只）· 十大流通内机构 " + fmtPct(sum.institution);
  if (st.org_partial_note) orgExtra += "；" + st.org_partial_note;
  grid.appendChild(layerCard(LAYER_MAP.institution,
    fmtPct(orgTotal && orgTotal.shares_ratio).replace("%", "<small>% 总股本</small>"),
    orgDelta !== null && orgDelta !== undefined ? { html: fmtDelta(orgDelta), cls: signedClass(orgDelta) } : null,
    sig.institution, null, orgExtra,
    "机构汇总期 " + (st.org_as_of || "—") + "（中报/年报全口径）"));

  // 游资/大户
  var lhbN = (s.lhb || []).length;
  var lastLhb = lhbN ? s.lhb[0] : null;
  grid.appendChild(layerCard(LAYER_MAP.hot,
    String(lhbN) + "<small> 次上榜 / 近一年</small>",
    null,
    sig.hot, null,
    lastLhb ? "最近 " + lastLhb.date + " · " + (lastLhb.reason || "") + " · 净买入 " + fmtYi((lastLhb.buy_amt || 0) - (lastLhb.sell_amt || 0)) : "近一年未上龙虎榜，游资存在感低",
    null));

  // 散户
  var hn = (s.holder_num || [])[0] || {};
  grid.appendChild(layerCard(LAYER_MAP.retail,
    (hn.num ? (hn.num / 10000).toFixed(2) : "—") + "<small> 万户</small>",
    hn.change_pct !== null && hn.change_pct !== undefined ? { html: (hn.change_pct > 0 ? "+" : "") + Number(hn.change_pct).toFixed(1) + "%", cls: hn.change_pct > 0 ? "up" : "dn" } : null,
    sig.retail, null,
    "股东户数（" + (hn.date || "—") + "）· 户数激增+融资急升视为反向信号",
    null));

  sec.appendChild(grid);
  return sec;
}
</script>
<script>
// ================= 十大流通股东 =================
function renderTop10(s) {
  var sec = el("div", "section");
  var t = el("div", "section-title", "十大流通股东（按层级着色）");
  t.appendChild(el("span", "asof", "披露期 " + (s.structure.as_of || "—")));
  sec.appendChild(t);
  var box = el("div", "table-scroll");
  var tb = el("table");
  tb.innerHTML = "<thead><tr><th>#</th><th>股东</th><th>层级</th><th class='num'>占流通</th><th class='num'>持股</th><th class='num'>较上期</th></tr></thead>";
  var body = el("tbody");
  (s.structure.top10 || []).forEach(function (h) {
    var tr = el("tr");
    tr.appendChild(el("td", null, String(h.rank)));
    var nm = el("td"); nm.appendChild(el("span", "nm", h.name)); tr.appendChild(nm);
    var lt = el("td");
    var lm = LAYER_MAP[h.layer] || { label: "未归类", color: "#c3c9d2" };
    var tag = el("span", "ltag");
    var sw = el("span", "sw"); sw.style.background = lm.color;
    tag.appendChild(sw); tag.appendChild(document.createTextNode(lm.label));
    lt.appendChild(tag); tr.appendChild(lt);
    tr.appendChild(el("td", "num", fmtPct(h.pct_float)));
    tr.appendChild(el("td", "num", fmtWan(h.shares) + "股"));
    var chg = h.change, chgText = chg, cls = "";
    if (chg === "新进") { chgText = "新进"; cls = "up"; }
    else if (chg === "不变" || chg === null || chg === undefined) { chgText = chg || "—"; }
    else {
      var n = Number(chg);
      if (!isNaN(n)) { chgText = (n > 0 ? "+" : "-") + fmtWan(Math.abs(n)); cls = n > 0 ? "up" : "dn"; }
    }
    var ctd = el("td", "num");
    var cs = el("span", "chg " + cls, chgText);
    ctd.appendChild(cs); tr.appendChild(ctd);
    body.appendChild(tr);
  });
  tb.appendChild(body); box.appendChild(tb); sec.appendChild(box);
  return sec;
}

// ================= 机构持仓分类 =================
function renderOrgs(s) {
  var sec = el("div", "section");
  var t = el("div", "section-title", "机构持仓分类汇总（全口径，不限十大）");
  t.appendChild(el("span", "asof", "披露期 " + (s.structure.org_as_of || "—")));
  sec.appendChild(t);
  var list = el("div", "org-list");
  var rows = (s.structure.org_holdings || []).filter(function (o) { return o.name !== "合计" && o.shares_ratio > 0.005; });
  var prevMap = {};
  (s.structure.org_holdings_prev || []).forEach(function (o) { prevMap[o.name] = o.shares_ratio; });
  rows.sort(function (a, b) { return (b.shares_ratio || 0) - (a.shares_ratio || 0); });
  var max = rows.length ? rows[0].shares_ratio : 1;
  rows.forEach(function (o) {
    var r = el("div", "org-row");
    r.appendChild(el("span", "nm", o.name));
    r.appendChild(el("span", "cnt", (o.num || 0) + " 家"));
    var bar = el("div", "org-bar");
    var fill = el("div");
    fill.style.width = Math.max(1.5, (o.shares_ratio / max) * 100) + "%";
    bar.appendChild(fill); r.appendChild(bar);
    r.appendChild(el("span", "pct", fmtPct(o.shares_ratio)));
    // 与上一全口径期（中报/年报）比较，不用接口跨口径的 free_change
    var d = prevMap[o.name] !== undefined && prevMap[o.name] !== null && o.shares_ratio !== null
      ? o.shares_ratio - prevMap[o.name] : null;
    var dEl = el("span", "dlt");
    if (d !== null && !isNaN(d)) {
      dEl.textContent = fmtDelta(d);
      dEl.style.color = d > 0 ? "var(--kimi-color-danger)" : (d < 0 ? "var(--kimi-color-positive)" : "inherit");
    } else dEl.textContent = "—";
    r.appendChild(dEl);
    list.appendChild(r);
  });
  if (!rows.length) list.appendChild(el("div", "empty", "本期无机构持仓分类数据"));
  sec.appendChild(list);
  return sec;
}

// ================= 两融 / 户数 图表 =================
function lineChart(series, w, h) {
  // series: [{v:number, d:string}] 旧→新
  var svgNS = "http://www.w3.org/2000/svg";
  var svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("viewBox", "0 0 " + w + " " + h);
  var vals = series.map(function (p) { return p.v; }).filter(function (v) { return v !== null && !isNaN(v); });
  if (!vals.length) return svg;
  var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
  if (max === min) { max += 1; min -= 1; }
  var pad = 4;
  function X(i) { return pad + i * (w - 2 * pad) / Math.max(1, series.length - 1); }
  function Y(v) { return h - pad - (v - min) * (h - 2 * pad) / (max - min); }
  var pts = [];
  series.forEach(function (p, i) { if (p.v !== null && !isNaN(p.v)) pts.push(X(i).toFixed(1) + "," + Y(p.v).toFixed(1)); });
  var pl = document.createElementNS(svgNS, "polyline");
  pl.setAttribute("points", pts.join(" "));
  pl.setAttribute("fill", "none");
  pl.setAttribute("stroke", "#5548c8");
  pl.setAttribute("stroke-width", "1.6");
  svg.appendChild(pl);
  var last = series[series.length - 1];
  if (last && last.v !== null) {
    var c = document.createElementNS(svgNS, "circle");
    c.setAttribute("cx", X(series.length - 1)); c.setAttribute("cy", Y(last.v)); c.setAttribute("r", "2.6");
    c.setAttribute("fill", "#5548c8");
    svg.appendChild(c);
  }
  return svg;
}

function barChart(series, w, h) {
  var svgNS = "http://www.w3.org/2000/svg";
  var svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("viewBox", "0 0 " + w + " " + h);
  var vals = series.map(function (p) { return p.v; }).filter(function (v) { return v !== null && !isNaN(v); });
  if (!vals.length) return svg;
  var max = Math.max.apply(null, vals);
  var n = series.length, pad = 4;
  var bw = (w - 2 * pad) / n;
  series.forEach(function (p, i) {
    if (p.v === null || isNaN(p.v)) return;
    var bh = (p.v / max) * (h - 2 * pad);
    var r = document.createElementNS(svgNS, "rect");
    r.setAttribute("x", (pad + i * bw + bw * 0.18).toFixed(1));
    r.setAttribute("y", (h - pad - bh).toFixed(1));
    r.setAttribute("width", (bw * 0.64).toFixed(1));
    r.setAttribute("height", bh.toFixed(1));
    r.setAttribute("rx", "1.5");
    r.setAttribute("fill", i === n - 1 ? "#5548c8" : "#c9c4ee");
    svg.appendChild(r);
  });
  return svg;
}

function renderCharts(s) {
  var sec = el("div", "section");
  sec.appendChild(el("div", "section-title", "散户层高频代理：两融余额与股东户数"));
  var grid = el("div", "chart-grid");

  // 两融
  var mg = (s.margin || []).slice().reverse(); // 旧→新
  var mLatest = (s.margin || [])[0];
  var c1 = el("div", "chart-card");
  var t1 = el("div", "cc-title", "两融余额（日频，近一年）");
  t1.appendChild(el("span", "v", mLatest ? fmtYi(mLatest.rzrqye) : "—"));
  c1.appendChild(t1);
  c1.appendChild(el("div", "cc-sub", mLatest ? "截至 " + mLatest.date + " · 融资余额 " + fmtYi(mLatest.rzye) + " · 融券余量 " + fmtWan(mLatest.rqyl) + "股" : "本期无数据"));
  c1.appendChild(lineChart(mg.map(function (r) { return { v: r.rzrqye, d: r.date }; }), 560, 120));
  grid.appendChild(c1);

  // 户数
  var hn = (s.holder_num || []).slice().reverse();
  var hLatest = (s.holder_num || [])[0];
  var c2 = el("div", "chart-card");
  var t2 = el("div", "cc-title", "股东户数（季频多期）");
  t2.appendChild(el("span", "v", hLatest ? (hLatest.num / 10000).toFixed(2) + " 万户" : "—"));
  c2.appendChild(t2);
  c2.appendChild(el("div", "cc-sub", hLatest ? "截至 " + hLatest.date + " · 环比 " + (hLatest.change_pct > 0 ? "+" : "") + Number(hLatest.change_pct || 0).toFixed(2) + "% · 户均市值 " + fmtWan(hLatest.avg_mkt_cap) + "元" : "本期无数据"));
  c2.appendChild(barChart(hn.map(function (r) { return { v: r.num, d: r.date }; }), 560, 120));
  grid.appendChild(c2);

  sec.appendChild(grid);
  return sec;
}

// ================= 龙虎榜 =================
function renderLhb(s) {
  var sec = el("div", "section");
  var t = el("div", "section-title", "龙虎榜与席位（游资层观察窗）");
  t.appendChild(el("span", "asof", "近一年 " + (s.lhb || []).length + " 次上榜"));
  sec.appendChild(t);
  if (!(s.lhb || []).length) {
    sec.appendChild(el("div", "empty", "近一年未上龙虎榜"));
    return sec;
  }
  s.lhb.forEach(function (r) {
    var item = el("div", "lhb-item");
    var top = el("div", "lh-top");
    top.appendChild(el("span", "lh-date", r.date));
    top.appendChild(el("span", "lh-reason", r.reason || ""));
    var net = (r.buy_amt || 0) - (r.sell_amt || 0);
    var netEl = el("span", "lh-net", "净买入 " + fmtYi(net));
    netEl.style.color = net >= 0 ? "var(--kimi-color-danger)" : "var(--kimi-color-positive)";
    top.appendChild(netEl);
    item.appendChild(top);
    item.appendChild(el("div", "lh-seats", "买入 " + fmtYi(r.buy_amt) + " · 卖出 " + fmtYi(r.sell_amt) + " · 占当日成交 " + fmtPct(r.deal_ratio, 1)));
    var seats = (s.lhb_seats || {})[r.date];
    if (seats && seats.length) {
      var lines = seats.map(function (x) {
        var side = x.side === "both" ? "买/卖双榜" : (x.side === "buy" ? "买入前五" : "卖出前五");
        return x.dept + "（" + side + "，净 " + fmtYi(x.net) + "）";
      });
      item.appendChild(el("div", "lh-seats", "席位：" + lines.join("；")));
    }
    sec.appendChild(item);
  });
  return sec;
}

// ================= 事件时间线 =================
function renderEvents(s) {
  var sec = el("div", "section");
  sec.appendChild(el("div", "section-title", "产业资本事件（增减持 / 解禁）"));
  var list = el("div", "evt-list");
  if (!(s.events || []).length) {
    list.appendChild(el("div", "empty", "近一年无增减持/解禁事件"));
  }
  (s.events || []).forEach(function (e) {
    var row = el("div", "evt");
    row.appendChild(el("span", "d", e.date));
    var tag = el("span", "t"); tag.appendChild(sigPill(e.nature === "pos" ? "pos" : e.nature === "neg" ? "neg" : e.nature === "watch" ? "watch" : "neu"));
    row.appendChild(tag);
    row.appendChild(el("span", "n", (e.actor ? e.actor + " · " : "") + (e.note || e.type)));
    list.appendChild(row);
  });
  sec.appendChild(list);
  return sec;
}

// ================= 缺口说明 + 免责 =================
function renderFoot(s) {
  var frag = document.createDocumentFragment();
  var gap = el("div", "gap-note",
    "口径缺口提示：① 回购明细、主动/被动公募拆分暂无公开免密接口，由外部数据源季度补位（不阻塞周更）；② 主力资金日频接口部分网络不可达，缺省时散户层以「户数+两融」双代理；③ 北向自 2024-08 起仅季度披露，边际变化看季报差值。" +
    (s.main_force && s.main_force.length ? "" : " 本期主力资金序列缺省。"));
  frag.appendChild(gap);
  frag.appendChild(el("div", "foot",
    "五层划分依据：控股股东/员工持股/回购专户→产业资本；香港中央结算/QFII/主权基金→外资；公募/私募/保险/社保/券商→境内机构；龙虎榜席位→游资；其余个人→散户。分类映射见仓库 config.json，未识别股东会记入 unmapped_holders.log 人工复核。数据来源：东方财富公开数据。仅供参考，不构成投资建议。"));
  return frag;
}

// ================= 主渲染 =================
function render(d) {
  app.innerHTML = "";
  if (!d || !d.stocks || !d.stocks.length) {
    app.appendChild(el("div", "empty", "数据加载中…"));
    return;
  }
  if (!selectedCode || !d.stocks.some(function (s) { return s.code === selectedCode; })) {
    selectedCode = d.stocks[0].code;
  }
  var s = d.stocks.filter(function (x) { return x.code === selectedCode; })[0];
  app.appendChild(renderHead(d));
  app.appendChild(renderLayers(s));
  app.appendChild(renderTop10(s));
  app.appendChild(renderOrgs(s));
  app.appendChild(renderCharts(s));
  app.appendChild(renderLhb(s));
  app.appendChild(renderEvents(s));
  app.appendChild(renderFoot(s));
}

function boot() {
  try { var v = localStorage.getItem("ashareView"); if (v) selectedCode = v; } catch (e) {}
  loadData({
    remoteUrls: [
      "https://raw.githubusercontent.com/Tomahawkgit/hk-holdings-tracker/main/ashare/ashare_data.json",
      "https://cdn.jsdelivr.net/gh/Tomahawkgit/hk-holdings-tracker@main/ashare/ashare_data.json"
    ],
    localUrl: "ashare_data.json",
    fallback: FALLBACK_DATA,
    render: render,
    merge: true,
    onFail: function () { var a = document.getElementById("app"); a.innerHTML = ""; a.appendChild(el("div", "empty", "数据加载失败，请稍后刷新")); }
  });
}
boot();
</script>
